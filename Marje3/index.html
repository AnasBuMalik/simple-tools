<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<meta name="description" content="مرجع — أداة إدارة وملاحظات المراجع مع مزامنة Google Drive">
<title>مرجع — أداة إدارة المراجع</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

</script>

<style>
/* ============================================================
   ثيم دفتر الملاحظات — متغيرات الألوان
   ============================================================ */
:root{
  --paper:#fdfaf3;
  --paper-2:#f5efe1;
  --card:#fffdf8;
  --ink:#2c2a26;
  --muted:#7d7566;
  --line:#e6dfcc;
  --line-strong:#d6cdb5;
  --margin-line:#e8a6a6;
  --accent:#b45309;
  --accent-2:#0f766e;
  --accent-soft:rgba(180,83,9,.12);
  --teal:#0f766e;
  --danger:#dc2626;
  --ok:#10b981;
  --shadow:0 1px 2px rgba(90,70,30,.06), 0 10px 28px rgba(90,70,30,.09);
  --shadow-sm:0 1px 2px rgba(90,70,30,.07), 0 3px 10px rgba(90,70,30,.06);
}
[data-theme="dark"]{
  --paper:#15161a;
  --paper-2:#1c1e23;
  --card:#1e2127;
  --ink:#e9e6df;
  --muted:#9b968c;
  --line:#2c3037;
  --line-strong:#3a3f48;
  --margin-line:#7d3b3b;
  --accent:#f59e0b;
  --accent-2:#2dd4bf;
  --accent-soft:rgba(245,158,11,.14);
  --teal:#2dd4bf;
  --danger:#ef4444;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.28);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Noto Naskh Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,-apple-system,sans-serif;
  background-color:var(--paper);
  color:var(--ink);
  line-height:1.75;
  transition:background-color .25s ease,color .25s ease;
  overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit}
svg{flex-shrink:0}

/* ============================================================
   الشريط العلوي
   ============================================================ */
.appbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(90,70,30,.05);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;white-space:nowrap;color:var(--ink)}
.brand-mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--teal));
  color:#fff;box-shadow:var(--shadow-sm);
}
.brand-name{letter-spacing:-.2px}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{
  width:100%;padding:9px 40px 9px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:14.5px;outline:none;transition:.18s;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-ico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;display:flex}
.appbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  white-space:nowrap;
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block;flex-shrink:0}
.badge.ok{color:#065f46;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.10)}
.badge.ok .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.badge.off{color:#991b1b;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.10)}
.badge.off .dot{background:var(--danger)}
[data-theme="dark"] .badge.ok{color:#6ee7b7}
[data-theme="dark"] .badge.off{color:#fca5a5}

/* ============================================================
   أزرار
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{background:var(--paper-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);border-color:transparent;color:#fff}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-teal{background:var(--teal);border-color:transparent;color:#fff}
.btn-danger{background:var(--danger);border-color:transparent;color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon-only{padding:8px;width:36px;height:36px}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:var(--paper-2);border-color:var(--line);color:var(--ink)}

/* ============================================================
   الهيكل العام
   ============================================================ */
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 130px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-size:25px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.page-sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.divider{
  height:2px;width:100%;margin:6px 0 20px;border-radius:2px;
  background:repeating-linear-gradient(to left,var(--line-strong) 0 10px,transparent 10px 16px);
  opacity:.7;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

/* بطاقة التصنيف */
.cat-card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease;
  overflow:hidden;
}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-card::before{
  content:'';position:absolute;inset-inline:0;top:0;height:5px;
  background:var(--cat-color,var(--accent));
}
.cat-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 68%);
          mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 68%);
}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative;z-index:2}
.cat-ico{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:var(--paper-2);border:1px solid var(--line);color:var(--accent);
  margin-top:6px;position:relative;z-index:2;
}
.cat-name{font-size:16.5px;font-weight:800;margin:10px 0 4px;position:relative;z-index:2}
.cat-meta{font-size:12.5px;color:var(--muted);position:relative;z-index:2}
.cat-tools{display:flex;gap:2px;opacity:.35;transition:.2s;position:relative;z-index:3}
.cat-card:hover .cat-tools{opacity:1}

/* بطاقة المرجع */
.ref-card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);
  transition:box-shadow .18s ease,transform .18s ease;
}
.ref-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ref-card::before{
  content:'';position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:4px;
  border-radius:0 4px 4px 0;background:var(--margin-line);opacity:.85;
}
.ref-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ref-title{margin:0;font-size:16px;font-weight:800;line-height:1.5;word-break:break-word}
.ref-tools{display:flex;gap:2px;flex-shrink:0;opacity:.35;transition:.2s}
.ref-card:hover .ref-tools{opacity:1}
.ref-desc{
  margin:8px 0 0;color:var(--ink);opacity:.88;font-size:14.5px;line-height:28px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);
  background-position:0 2px;word-break:break-word;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:5px;max-width:100%;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);text-decoration:none;
  border:1px solid transparent;transition:.15s;overflow:hidden;
}
.chip:hover{filter:brightness(.95);border-color:var(--accent)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.cat-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--paper-2);color:var(--muted);border:1px solid var(--line);margin-bottom:8px;
}
.ref-list{display:grid;gap:14px}

/* الحالة الفارغة */
.empty{
  text-align:center;padding:56px 20px;color:var(--muted);
  border:2px dashed var(--line-strong);border-radius:18px;background:var(--card);
}
.empty svg{margin-bottom:14px;opacity:.55}
.empty p{margin:0 0 6px;font-size:15.5px}

.section-title{
  font-size:15px;font-weight:800;color:var(--muted);margin:26px 0 12px;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--line)}

/* ============================================================
   النوافذ المنبثقة
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:200;padding:16px;
  background:rgba(25,18,8,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  width:100%;max-width:580px;max-height:88vh;overflow:auto;
  padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-title{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal-text{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.9}
.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.input{
  width:100%;padding:10px 12px;border-radius:11px;font-size:14.5px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  outline:none;transition:.16s;resize:vertical;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
textarea.input{line-height:1.9;min-height:96px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.8}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.section{
  border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-top:14px;background:var(--paper);
}
.section h4{margin:0 0 4px;font-size:14.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.links-box{display:grid;gap:8px}
.link-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;align-items:center}
@media(max-width:520px){.link-row{grid-template-columns:1fr auto}.link-row input:nth-child(2){grid-column:1/-1}}
.icon-picker,.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.icon-opt{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
  background:var(--paper-2);border:2px solid transparent;color:var(--muted);transition:.15s;
}
.icon-opt:hover{color:var(--ink);background:var(--card)}
.icon-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.swatch{width:32px;height:32px;border-radius:10px;cursor:pointer;border:3px solid transparent;transition:.15s}
.swatch.active{border-color:var(--ink);transform:scale(1.1)}

/* ============================================================
   زر عائم + التنبيهات
   ============================================================ */
.fab{
  position:fixed;bottom:24px;inset-inline-start:24px;z-index:90;
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 20px;border-radius:999px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 10px 28px rgba(180,83,9,.4);transition:.18s;
}
.fab:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.07)}
.fab:active{transform:scale(.97)}

#toasts{
  position:fixed;bottom:24px;inset-inline-end:24px;z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;
  background:#1f2937;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);
  animation:slideIn .22s ease;max-width:82vw;
}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.ok{background:#0f766e}
.toast.err{background:#b91c1c}
.toast.warn{background:#b45309}

.spin{animation:spin 1s linear infinite;display:inline-flex}
@keyframes spin{to{transform:rotate(360deg)}}

@media (hover:none){
  .cat-tools,.ref-tools{opacity:1}
}
@media print{.appbar,.fab,#toasts{display:none}}
</style>
</head>

<!-- ===================== الشريط العلوي ===================== -->
<header class="appbar">
  <div class="brand">
    <span class="brand-mark" data-icon="book" data-size="20"></span>
    <span class="brand-name">مرجع</span>
  </div>

  <div class="search-wrap">
    <span class="search-ico" data-icon="search" data-size="16"></span>
    <input id="searchInput" type="search" placeholder="ابحث في العناوين والأوصاف..." autocomplete="off">
  </div>

  <div class="appbar-actions">
    <span id="netBadge" class="badge"><span class="dot"></span><span class="txt">جارٍ الفحص</span></span>
    <button id="btnSync" class="btn btn-teal" title="مزامنة مع Google Drive">
      <span data-icon="cloud" data-size="16"></span><span>مزامنة</span>
    </button>
    <button id="btnTheme" class="btn icon-only" title="تبديل الثيم" data-icon-btn="theme"></button>
    <button id="btnInstall" class="btn btn-primary" hidden>
      <span data-icon="download" data-size="16"></span><span>تثبيت</span>
    </button>
    <button id="btnSettings" class="btn icon-only" title="الإعدادات">
      <span data-icon="settings" data-size="16"></span>
    </button>
  </div>
</header>

<!-- ===================== المحتوى ===================== -->
<main id="app" class="wrap"></main>

<div id="toasts"></div>

/* ============================================================
   1) أدوات مساعدة
   ============================================================ */
(function () {
  'use strict';

  const icon = window.svgIcon;

  const STORAGE_KEY  = 'marja.data.v1';
  const SETTINGS_KEY = 'marja.settings.v1';
  const FILE_NAME    = 'references_backup.json';
  const DRIVE_SCOPE  = 'https://www.googleapis.com/auth/drive.file';

  const LS = (function () {
    try {
      localStorage.setItem('__mj_t', '1');
      localStorage.removeItem('__mj_t');
      return localStorage;
    } catch (e) {
      const mem = {};
      return {
        getItem: k => (k in mem ? mem[k] : null),
        setItem: (k, v) => { mem[k] = String(v); },
        removeItem: k => { delete mem[k]; }
      };
    }
  })();

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function safeUrl(u) {
    try {
      const x = new URL(String(u), location.href);
      return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '#';
    } catch (e) { return '#'; }
  }
  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
  function fmtDate(ts) {
    try { return new Date(ts).toLocaleString('ar-EG'); } catch (e) { return String(ts); }
  }

  /* ============================================================
     2) حراس البروتوكول الآمن (PWA Safety Guards)
     ============================================================ */
  const PWA_ALLOWED = (function () {
    try {
      const proto = location.protocol;
      const host  = location.hostname;
      const okHost = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
      return proto === 'https:' || (proto === 'http:' && okHost);
    } catch (e) { return false; }
  })();

  /* ============================================================
     3) الحالة والبيانات
     ============================================================ */
  const PALETTE = ['#b45309', '#0f766e', '#7c3aed', '#be123c', '#0369a1', '#15803d', '#a16207', '#c2410c'];
  const CAT_ICONS = ['folder', 'book', 'file-text', 'newspaper', 'graduation', 'flask',
                     'code', 'scale', 'globe', 'palette', 'microscope', 'brain',
                     'briefcase', 'landmark', 'bar-chart', 'tag'];

  let state    = { categories: [], lastUpdated: 0 };
  let settings = { clientId: '', apiKey: '', theme: 'light' };
  let view     = { name: 'home', catId: null };
  let query    = '';

  function loadSettings() {
    try {
      const raw = LS.getItem(SETTINGS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        settings.clientId = s.clientId || '';
        settings.apiKey   = s.apiKey || '';
        settings.theme    = s.theme === 'dark' ? 'dark' : 'light';
      }
    } catch (e) {}
  }
  function saveSettings() {
    try { LS.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function seed() {
    state.categories = [{
      id: uid(), name: 'مراجع عامة', icon: 'book', color: PALETTE[0],
      createdAt: Date.now(), updatedAt: Date.now(),
      refs: [{
        id: uid(),
        title: 'مرحباً بك في أداة مرجع',
        desc: 'هذه أداة بسيطة لحفظ المراجع والملاحظات.\nيمكنك إنشاء تصنيفات لتنظيم مراجعك، وإضافة روابط خارجية لكل مرجع.\nكل شيء يُحفظ محلياً في متصفحك ويعمل بدون إنترنت.\nللمزامنة السحابية، افتح الإعدادات وأدخل مفاتيح Google Drive.',
        links: [],
        createdAt: Date.now(), updatedAt: Date.now()
      }]
    }];
    state.lastUpdated = Date.now();
    LS.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    try {
      const raw = LS.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.categories)) {
          state = { categories: d.categories, lastUpdated: d.lastUpdated || 0 };
          return;
        }
      }
    } catch (e) { console.warn('تعذّر قراءة البيانات المحلية', e); }
    seed();
  }

  function persist(touch) {
    if (touch !== false) state.lastUpdated = Date.now();
    try { LS.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('تعذّر الحفظ محلياً', 'err'); }
  }

  const getCat = id => state.categories.find(c => c.id === id) || null;
  const getRef = (cid, rid) => {
    const c = getCat(cid);
    return c ? (c.refs || []).find(r => r.id === rid) || null : null;
  };

  /* ============================================================
     4) التنبيهات
     ============================================================ */
  function toast(msg, type, ms) {
    const box = $('#toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    const icoName = type === 'ok' ? 'check' : (type === 'err' || type === 'warn') ? 'alert' : 'info';
    el.innerHTML = icon(icoName, 16) + '<span>' + esc(msg) + '</span>';
    box.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 260);
    }, ms || 2800);
  }

  /* ============================================================
     5) النوافذ المنبثقة
     ============================================================ */
  let overlayEl = null;

  function openModal(html) {
    closeModal();
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal">' + html + '</div>';
    ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
    ov.addEventListener('click', e => {
      if (e.target.closest('[data-close]')) closeModal();
    });
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    overlayEl = ov;
    // استبدال أيقونات data-icon داخل النافذة
    $$('[data-icon]', ov).forEach(el => {
      el.innerHTML = icon(el.dataset.icon, el.dataset.size || 18);
    });
    const first = ov.querySelector('input:not([type=hidden]),textarea');
    if (first) setTimeout(() => first.focus(), 60);
    return ov;
  }
  function closeModal() {
    if (overlayEl) { overlayEl.remove(); overlayEl = null; }
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function confirmDialog(title, msg, onYes, danger) {
    openModal(
      '<h3 class="modal-title">' + icon('alert', 20) + '<span>' + esc(title) + '</span></h3>' +
      '<p class="modal-text">' + esc(msg) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn ' + (danger === false ? 'btn-primary' : 'btn-danger') + '" id="cfYes">تأكيد</button>' +
        '<button class="btn" data-close>إلغاء</button>' +
      '</div>'
    );
    $('#cfYes').onclick = function () { closeModal(); onYes(); };
  }

  /* ============================================================
     6) العرض
     ============================================================ */
  const app = $('#app');

  function refCardHTML(ref, cat, showCatPill) {
    const links = Array.isArray(ref.links) ? ref.links : [];
    return '' +
      '<article class="ref-card">' +
        (showCatPill
          ? '<span class="cat-pill">' + icon(cat.icon || 'folder', 12) + ' ' + esc(cat.name) + '</span>'
          : '') +
        '<div class="ref-head">' +
          '<h3 class="ref-title">' + esc(ref.title || 'بدون عنوان') + '</h3>' +
          '<div class="ref-tools">' +
            '<button class="icon-btn" title="تعديل" data-action="edit-ref" data-cat="' + cat.id + '" data-ref="' + ref.id + '">' + icon('pencil', 15) + '</button>' +
            '<button class="icon-btn" title="حذف" data-action="del-ref" data-cat="' + cat.id + '" data-ref="' + ref.id + '">' + icon('trash', 15) + '</button>' +
          '</div>' +
        '</div>' +
        (ref.desc ? '<p class="ref-desc">' + esc(ref.desc).replace(/\n/g, '<br>') + '</p>' : '') +
        (links.length
          ? '<div class="chips">' + links.map(l =>
              '<a class="chip" href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer">' +
              icon('external-link', 12) + '<span>' + esc(l.label || l.url) + '</span></a>').join('') + '</div>'
          : '') +
      '</article>';
  }

  function catCardHTML(cat) {
    const n = (cat.refs || []).length;
    return '' +
      '<div class="cat-card" data-action="open-cat" data-cat="' + cat.id + '" style="--cat-color:' + esc(cat.color || PALETTE[0]) + '">' +
        '<div class="cat-top">' +
          '<div class="cat-ico">' + icon(cat.icon || 'folder', 22) + '</div>' +
          '<div class="cat-tools">' +
            '<button class="icon-btn" title="تعديل" data-action="edit-cat" data-cat="' + cat.id + '">' + icon('pencil', 15) + '</button>' +
            '<button class="icon-btn" title="حذف" data-action="del-cat" data-cat="' + cat.id + '">' + icon('trash', 15) + '</button>' +
          '</div>' +
        '</div>' +
        '<h3 class="cat-name">' + esc(cat.name) + '</h3>' +
        '<div class="cat-meta">' + n + ' ' + (n === 1 ? 'مرجع' : 'مراجع') + '</div>' +
      '</div>';
  }

  function renderHome() {
    const q = query.trim().toLowerCase();
    let html = '';

    html += '<div class="page-head">' +
      '<div>' +
        '<h1 class="page-title">' + icon('book', 24) + '<span>مكتبتي</span></h1>' +
        '<p class="page-sub">' + state.categories.length + ' تصنيف · ' +
        state.categories.reduce((a, c) => a + (c.refs || []).length, 0) + ' مرجع</p>' +
      '</div>' +
      '<button class="btn btn-primary" data-action="add-cat">' + icon('plus', 16) + '<span>تصنيف جديد</span></button>' +
    '</div><div class="divider"></div>';

    if (q) {
      const results = [];
      state.categories.forEach(c => {
        const catMatch = String(c.name).toLowerCase().includes(q);
        (c.refs || []).forEach(r => {
          const hay = (r.title + ' ' + (r.desc || '') + ' ' +
            (r.links || []).map(l => (l.label || '') + ' ' + (l.url || '')).join(' ')).toLowerCase();
          if (catMatch || hay.includes(q)) results.push({ c: c, r: r });
        });
      });

      html += '<div class="section-title">نتائج البحث (' + results.length + ')</div>';
      if (!results.length) {
        html += '<div class="empty">' + icon('search', 48) +
          '<p>لا توجد نتائج مطابقة لـ «' + esc(query) + '»</p></div>';
      } else {
        html += '<div class="ref-list">' + results.map(x => refCardHTML(x.r, x.c, true)).join('') + '</div>';
      }

      const matchingCats = state.categories.filter(c => String(c.name).toLowerCase().includes(q));
      if (matchingCats.length) {
        html += '<div class="section-title">تصنيفات مطابقة</div>';
        html += '<div class="grid">' + matchingCats.map(catCardHTML).join('') + '</div>';
      }
      return html;
    }

    if (!state.categories.length) {
      html += '<div class="empty">' + icon('book', 56) +
        '<p>لا توجد تصنيفات بعد.</p>' +
        '<p style="font-size:13.5px">ابدأ بإنشاء أول تصنيف لمراجعك.</p>' +
        '<div style="margin-top:18px"><button class="btn btn-primary" data-action="add-cat">' +
        icon('plus', 16) + '<span>إنشاء تصنيف</span></button></div></div>';
      return html;
    }

    html += '<div class="grid">' + state.categories.map(catCardHTML).join('') + '</div>';
    return html;
  }

  function renderCategory(catId) {
    const cat = getCat(catId);
    if (!cat) { view = { name: 'home', catId: null }; return renderHome(); }

    const q = query.trim().toLowerCase();
    let refs = cat.refs || [];
    if (q) {
      refs = refs.filter(r => {
        const hay = (r.title + ' ' + (r.desc || '') + ' ' +
          (r.links || []).map(l => (l.label || '') + ' ' + (l.url || '')).join(' ')).toLowerCase();
        return hay.includes(q);
      });
    }

    let html = '';
    html += '<div class="page-head">' +
      '<div>' +
        '<button class="btn btn-sm" data-action="back" style="margin-bottom:8px">' +
          icon('arrow-left', 14) + '<span>رجوع</span></button>' +
        '<h1 class="page-title">' + icon(cat.icon || 'folder', 24) + '<span>' + esc(cat.name) + '</span></h1>' +
        '<p class="page-sub">' + (cat.refs || []).length + ' مرجع في هذا التصنيف</p>' +
      '</div>' +
      '<button class="btn btn-primary" data-action="add-ref" data-cat="' + cat.id + '">' +
        icon('plus', 16) + '<span>مرجع جديد</span></button>' +
    '</div><div class="divider"></div>';

    if (!refs.length) {
      html += '<div class="empty">' + icon('file-text', 56) +
        (q
          ? '<p>لا توجد مراجع مطابقة للبحث.</p>'
          : '<p>هذا التصنيف فارغ.</p><p style="font-size:13.5px">أضف أول مرجع.</p>') +
        '<div style="margin-top:18px"><button class="btn btn-primary" data-action="add-ref" data-cat="' + cat.id + '">' +
        icon('plus', 16) + '<span>إضافة مرجع</span></button></div></div>';
      return html;
    }

    html += '<div class="ref-list">' + refs.map(r => refCardHTML(r, cat, false)).join('') + '</div>';
    return html;
  }

  function renderApp() {
    app.innerHTML = view.name === 'home' ? renderHome() : renderCategory(view.catId);

    const fab = document.createElement('button');
    fab.className = 'fab';
    if (view.name === 'home') {
      fab.innerHTML = icon('plus', 18) + '<span>تصنيف جديد</span>';
      fab.dataset.action = 'add-cat';
    } else {
      fab.innerHTML = icon('plus', 18) + '<span>مرجع جديد</span>';
      fab.dataset.action = 'add-ref';
      fab.dataset.cat = view.catId;
    }
    app.appendChild(fab);
  }

  /* ============================================================
     7) أحداث التطبيق
     ============================================================ */
  app.addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const catId  = el.dataset.cat;
    const refId  = el.dataset.ref;

    if (action === 'open-cat') {
      view = { name: 'category', catId: catId };
      renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (action === 'back') {
      view = { name: 'home', catId: null };
      renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (action === 'add-cat') {
      openCatModal(null);
    } else if (action === 'edit-cat') {
      e.stopPropagation(); openCatModal(catId);
    } else if (action === 'del-cat') {
      e.stopPropagation(); deleteCategory(catId);
    } else if (action === 'add-ref') {
      openRefModal(catId, null);
    } else if (action === 'edit-ref') {
      openRefModal(catId, refId);
    } else if (action === 'del-ref') {
      deleteReference(catId, refId);
    }
  });

  /* ============================================================
     8) نوافذ التصنيفات والمراجع
     ============================================================ */

  /* ============================================================
     12) Google Drive — التهيئة والمزامنة
     ============================================================ */
  let gisLoaded = false, gapiLoaded = false, tokenClient = null;
  let accessToken = null, tokenExpiry = 0;
  let syncing = false;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const existing = document.querySelector('script[data-src="' + src + '"]');
      if (existing) {
        if (existing.dataset.loaded === '1') return resolve();
        existing.addEventListener('load', () => resolve());
        existing.addEventListener('error', () => reject(new Error('فشل تحميل: ' + src)));
        return;
      }
      const s = document.createElement('script');
      s.src = src; s.async = true; s.defer = true;
      s.dataset.src = src;
      s.onload = function () { s.dataset.loaded = '1'; resolve(); };
      s.onerror = function () { reject(new Error('فشل تحميل: ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function ensureGoogle() {
    if (!navigator.onLine) throw new Error('لا يوجد اتصال بالإنترنت');
    if (!settings.clientId) throw new Error('أدخل Client ID من الإعدادات أولاً');

    if (!gisLoaded) {
      await loadScript('https://accounts.google.com/gsi/client');
      gisLoaded = true;
    }
    if (!gapiLoaded) {
      try {
        await loadScript('https://apis.google.com/js/api.js');
        await new Promise(function (res) {
          if (window.gapi && window.gapi.load) window.gapi.load('client', res);
          else res();
        });
        if (window.gapi && window.gapi.client && settings.apiKey) {
          try {
            await window.gapi.client.init({
              apiKey: settings.apiKey,
              discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
            });
          } catch (e) { console.warn('gapi.client.init فشل — سيتم استخدام fetch مباشرة'); }
        }
        gapiLoaded = true;
      } catch (e) {
        console.warn('تعذّر تحميل gapi، سيتم الاعتماد على fetch');
      }
    }
    if (!tokenClient) {
      tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: settings.clientId,
        scope: DRIVE_SCOPE,
        callback: function () {}
      });
    }
  }

  function getToken(interactive) {
    return new Promise(function (resolve, reject) {
      if (accessToken && Date.now() < tokenExpiry - 60000) return resolve(accessToken);
      if (!tokenClient) return reject(new Error('لم يتم تهيئة Google بعد'));
      tokenClient.callback = function (resp) {
        if (resp.error) return reject(new Error('فشل التفويض: ' + resp.error));
        accessToken = resp.access_token;
        tokenExpiry = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
        resolve(accessToken);
      };
      try {
        tokenClient.requestAccessToken({ prompt: interactive === false ? '' : 'consent' });
      } catch (e) { reject(e); }
    });
  }

  async function findBackupFile() {
    const q = "name='" + FILE_NAME + "' and trashed=false";
    const url = 'https://www.googleapis.com/drive/v3/files'
      + '?q=' + encodeURIComponent(q)
      + '&spaces=drive'
      + '&orderBy=' + encodeURIComponent('modifiedTime desc')
      + '&fields=' + encodeURIComponent('files(id,name,modifiedTime,size)');
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if (res.status === 401) { accessToken = null; throw new Error('انتهت صلاحية الجلسة، أعد المحاولة'); }
    if (!res.ok) throw new Error('تعذّر الوصول إلى Drive (' + res.status + ')');
    const data = await res.json();
    return (data.files && data.files[0]) || null;
  }

  async function downloadBackup(fileId) {
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (!res.ok) throw new Error('تعذّر تنزيل النسخة السحابية (' + res.status + ')');
    return await res.json();
  }

  async function uploadBackup(fileId) {
    const meta = { name: FILE_NAME, mimeType: 'application/json' };
    const content = JSON.stringify(state, null, 2);
    const boundary = '-------marja' + Date.now().toString(36);
    const body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      content + '\r\n' +
      '--' + boundary + '--';

    const base = 'https://www.googleapis.com/upload/drive/v3/files';
    const url = fileId ? (base + '/' + fileId + '?uploadType=multipart') : (base + '?uploadType=multipart');
    const method = fileId ? 'PATCH' : 'POST';

    const res = await fetch(url, {
      method: method,
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'multipart/related; boundary=' + boundary
      },
      body: body
    });
    if (res.status === 401) { accessToken = null; throw new Error('انتهت صلاحية الجلسة، أعد المحاولة'); }
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('فشل الرفع (' + res.status + ') ' + t.slice(0, 120));
    }
    return await res.json();
  }

  function mergeStates(a, b) {
    const cats = new Map();
    function addCat(c) {
      if (!c || !c.id) return;
      const existing = cats.get(c.id);
      if (!existing) { cats.set(c.id, deepCopy(c)); return; }
      const refs = new Map();
      (existing.refs || []).forEach(r => refs.set(r.id, r));
      (c.refs || []).forEach(r => {
        const prev = refs.get(r.id);
        if (!prev || (r.updatedAt || 0) > (prev.updatedAt || 0)) refs.set(r.id, r);
      });
      existing.refs = Array.from(refs.values());
      if ((c.updatedAt || 0) > (existing.updatedAt || 0)) {
        existing.name = c.name; existing.icon = c.icon; existing.color = c.color;
        existing.updatedAt = c.updatedAt;
      }
    }
    (a.categories || []).forEach(addCat);
    (b.categories || []).forEach(addCat);
    return {
      categories: Array.from(cats.values()),
      lastUpdated: Math.max(a.lastUpdated || 0, b.lastUpdated || 0, Date.now())
    };
  }

  function setSyncUI(text, spinning) {
    const b = $('#btnSync');
    if (!b) return;
    b.innerHTML = '<span class="' + (spinning ? 'spin' : '') + '">' +
      icon(spinning ? 'loader' : 'cloud', 16) + '</span><span>' + esc(text) + '</span>';
  }

  async function syncNow() {
    if (syncing) return;
    if (!navigator.onLine) { toast('لا يوجد اتصال بالإنترنت', 'warn'); return; }
    if (!settings.clientId) {
      toast('أدخل Client ID من الإعدادات أولاً', 'warn');
      openSettings();
      return;
    }

    syncing = true;
    setSyncUI('جارٍ المزامنة', true);
    try {
      await ensureGoogle();
      await getToken(true);
      setSyncUI('جارٍ المزامنة', true);

      const file = await findBackupFile();

      if (!file) {
        await uploadBackup(null);
        toast('تم إنشاء نسخة احتياطية على Drive', 'ok');
        setSyncUI('تمت المزامنة');
        return;
      }

      const remote = await downloadBackup(file.id);
      if (!remote || !Array.isArray(remote.categories)) throw new Error('الملف السحابي غير صالح');

      const remoteTime = Number(remote.lastUpdated) || 0;
      const localTime  = Number(state.lastUpdated) || 0;
      const DIFF = 2000;

      if (remoteTime > localTime + DIFF) {
        showConflictDialog(remote, file);
      } else if (localTime > remoteTime + DIFF) {
        await uploadBackup(file.id);
        toast('تم رفع نسختك المحلية إلى Drive', 'ok');
        setSyncUI('تمت المزامنة');
      } else {
        toast('البيانات متطابقة مع السحابة', 'ok');
        setSyncUI('متزامن');
      }
    } catch (err) {
      console.error(err);
      toast(err.message || 'فشلت المزامنة', 'err', 4000);
      setSyncUI('مزامنة');
    } finally {
      syncing = false;
      setTimeout(() => { if (!syncing) setSyncUI('مزامنة'); }, 2500);
    }
  }

  function showConflictDialog(remote, file) {
    const localDate  = state.lastUpdated ? fmtDate(state.lastUpdated) : '—';
    const remoteDate = remote.lastUpdated ? fmtDate(remote.lastUpdated) : '—';

    openModal(
      '<h3 class="modal-title">' + icon('alert', 20) + '<span>تعارض في البيانات</span></h3>' +
      '<p class="modal-text">النسخة السحابية أحدث من نسختك المحلية.<br>' +
      'المحلي: <b>' + esc(localDate) + '</b><br>' +
      'السحابي: <b>' + esc(remoteDate) + '</b></p>' +
      '<div class="row" style="flex-direction:column;align-items:stretch">' +
        '<button class="btn btn-primary" id="cfMerge">دمج النسختين (موصى به)</button>' +
        '<button class="btn" id="cfPull">استبدال المحلي بالنسخة السحابية</button>' +
        '<button class="btn" id="cfPush">الاحتفاظ بالمحلي ورفعه للسحابة</button>' +
        '<button class="btn" data-close>إلغاء</button>' +
      '</div>'
    );

    $('#cfMerge').onclick = async function () {
      closeModal();
      try {
        const merged = mergeStates(state, remote);
        state = merged;
        persist(false);
        await uploadBackup(file.id);
        renderApp();
        toast('تم الدمج والرفع بنجاح', 'ok');
        setSyncUI('متزامن');
      } catch (e) { toast(e.message, 'err'); }
    };

    $('#cfPull').onclick = function () {
      closeModal();
      state = { categories: remote.categories, lastUpdated: remote.lastUpdated || Date.now() };
      persist(false);
      renderApp();
      toast('تم استرجاع النسخة السحابية', 'ok');
      setSyncUI('متزامن');
    };

    $('#cfPush').onclick = async function () {
      closeModal();
      try {
        await uploadBackup(file.id);
        toast('تم رفع نسختك المحلية', 'ok');
        setSyncUI('متزامن');
      } catch (e) { toast(e.message, 'err'); }
    };
  }

  $('#btnSync').onclick = syncNow;

        toast('جارٍ الاتصال بـ Google...', 'warn');
        await ensureGoogle();
        await getToken(true);
        toast('تم الاتصال بنجاح', 'ok');
        closeModal();
      } catch (e) { toast(e.message || 'فشل الاتصال', 'err', 4000); }
    };

    $('#disconnectGoogle').onclick = function () {
      try {
        if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
          google.accounts.oauth2.revoke(accessToken, function () {});
        }
      } catch (e) {}
      accessToken = null; tokenExpiry = 0;
      toast('تم قطع الاتصال', 'ok');
      closeModal();
    };

    $('#exportJson').onclick = function () {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'references_backup_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast('تم تصدير الملف', 'ok');
      } catch (e) { toast('فشل التصدير', 'err'); }
    };

    $('#importJson').onclick = function () {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'application/json,.json';
      inp.onchange = function () {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = function () {
          try {
            const data = JSON.parse(rd.result);
            if (!data || !Array.isArray(data.categories)) throw new Error('بنية الملف غير صحيحة');
            closeModal();
            showImportDialog(data);
          } catch (e) { toast('ملف غير صالح: ' + e.message, 'err', 4000); }
        };
        rd.readAsText(f);
      };
      inp.click();
    };

    $('#resetAll').onclick = function () {
      closeModal();
      confirmDialog('حذف كل البيانات', 'سيتم حذف جميع التصنيفات والمراجع نهائياً من هذا المتصفح.', function () {
        LS.removeItem(STORAGE_KEY);
        state = { categories: [], lastUpdated: 0 };
        seed(); renderApp();
        toast('تمت إعادة التعيين', 'ok');
      });
    };
  }

  function showImportDialog(data) {
    openModal(
      '<h3 class="modal-title">' + icon('upload', 20) + '<span>استيراد البيانات</span></h3>' +
      '<p class="modal-text">الملف يحتوي على ' + (data.categories || []).length + ' تصنيف. اختر طريقة الاستيراد:</p>' +
      '<div class="row" style="flex-direction:column;align-items:stretch">' +
        '<button class="btn btn-primary" id="impMerge">دمج مع البيانات الحالية</button>' +
        '<button class="btn btn-danger" id="impReplace">استبدال البيانات الحالية بالكامل</button>' +
        '<button class="btn" data-close>إلغاء</button>' +
      '</div>'
    );
    $('#impMerge').onclick = function () {
      closeModal();
      state = mergeStates(state, data);
      persist(false); renderApp();
      toast('تم الدمج بنجاح', 'ok');
    };
    $('#impReplace').onclick = function () {
      closeModal();
      state = { categories: data.categories, lastUpdated: data.lastUpdated || Date.now() };
      persist(false); renderApp();
      toast('تم استبدال البيانات', 'ok');
    };
  }

  $('#btnSettings').onclick = openSettings;

  /* ============================================================
     14) PWA — المانيفست والأيقونات
     ============================================================ */
  function drawRounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');

    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#b45309');
    g.addColorStop(1, '#0f766e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    // الصفحة الورقية
    ctx.fillStyle = '#fffdf8';
    drawRounded(ctx, size * 0.19, size * 0.15, size * 0.62, size * 0.70, size * 0.075);
    ctx.fill();

    // خط الهامش
    ctx.fillStyle = '#e8a6a6';
    ctx.fillRect(size * 0.465, size * 0.15, size * 0.028, size * 0.70);

    // الأسطر
    ctx.fillStyle = '#ddd5c2';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(size * 0.265, size * 0.295 + i * size * 0.115, size * 0.47, size * 0.034);
    }

    // شريط المرجع
    ctx.fillStyle = '#b45309';
    drawRounded(ctx, size * 0.62, size * 0.15, size * 0.13, size * 0.26, size * 0.03);
    ctx.fill();

    return c.toDataURL('image/png');
  }

  function injectManifest() {
    if (!PWA_ALLOWED) return;
    try {
      const icon192 = makeIcon(192);
      const icon512 = makeIcon(512);

      const manifest = {
        name: 'مرجع — أداة إدارة المراجع',
        short_name: 'مرجع',
        description: 'أداة إدارة وملاحظات المراجع مع مزامنة Google Drive',
        lang: 'ar',
        dir: 'rtl',
        start_url: location.pathname + location.search,
        scope: './',
        display: 'standalone',
        orientation: 'portrait-primary',
        background_color: '#fdfaf3',
        theme_color: '#b45309',
        categories: ['productivity', 'education'],
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);

      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = icon192;
      document.head.appendChild(apple);
    } catch (e) {
      console.warn('تعذّر توليد المانيفست:', e);
    }
  }

  function tryServiceWorkerUpgrade() {
    if (!PWA_ALLOWED) return;
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      fetch('sw.js', { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          const ct = (r.headers.get('content-type') || '').toLowerCase();
          if (r.ok && (ct.indexOf('javascript') !== -1 || ct.indexOf('ecmascript') !== -1)) {
            return navigator.serviceWorker.register('sw.js', { scope: './' });
          }
          return null;
        })
        .then(function (reg) {
          if (reg) console.info('Service Worker مُفعّل — التطبيق قابل للتثبيت كـ WebAPK');
        })
        .catch(function () { /* الوضع Baseline عبر LocalStorage */ });
    });
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    const btn = $('#btnInstall');
    if (btn && PWA_ALLOWED) btn.hidden = false;
  });
  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    const btn = $('#btnInstall');
    if (btn) btn.hidden = true;
    toast('تم تثبيت التطبيق على جهازك', 'ok');
  });
  $('#btnInstall').addEventListener('click', async function () {
    if (!deferredPrompt) { toast('التثبيت غير متاح حالياً في هذا المتصفح', 'warn'); return; }
    deferredPrompt.prompt();
    try {
      const choice = await deferredPrompt.userChoice;
      if (choice && choice.outcome === 'accepted') toast('جارٍ التثبيت...', 'ok');
    } catch (e) {}
    deferredPrompt = null;
    $('#btnInstall').hidden = true;
  });

  /* ============================================================
     15) الإقلاع
     ============================================================ */
  function hydrateStaticIcons() {
    $$('[data-icon]').forEach(el => {
      el.innerHTML = icon(el.dataset.icon, el.dataset.size || 18);
    });
  }

  function boot() {
    loadSettings();
    applyTheme();
    loadState();
    hydrateStaticIcons();
    updateNet();
    renderApp();
    injectManifest();
    tryServiceWorkerUpgrade();

    if (!PWA_ALLOWED) {
      const btn = $('#btnInstall');
      if (btn) btn.hidden = true;
    }

    console.info('مرجع جاهز — PWA_ALLOWED = ' + PWA_ALLOWED);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>
