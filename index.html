<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدواتي · Simple Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1000px 500px at 100% -10%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(245,196,81,.07), transparent 60%),
      #0f172a;
    color:#e2e8f0;
    font-family:'Tajawal',system-ui,sans-serif;
    padding:2rem 1rem;
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{max-width:900px;width:100%}

  /* ---------- Header ---------- */
  header{text-align:center;margin-bottom:3rem}
  .logo{
    width:64px;height:64px;margin:0 auto 1rem;
    border-radius:1.15rem;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#f5c451,#c98f1d);
    box-shadow:0 16px 32px -16px #f5c451;
    font-size:1.9rem;
  }
  h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem}
  .sub{color:#94a3b8;font-size:.9rem}

  /* ---------- Search ---------- */
  .search{position:relative;margin:2rem auto 1.5rem;max-width:440px}
  .search input{
    width:100%;padding:.75rem 1rem .75rem 2.75rem;
    background:#1e293b;border:1px solid #334155;border-radius:.85rem;
    color:#e2e8f0;font-family:inherit;font-size:.9rem;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{
    outline:none;border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(96,165,250,.16);
  }
  .search input::placeholder{color:#64748b}
  .search::before{
    content:'🔍';position:absolute;
    right:1rem;top:50%;transform:translateY(-50%);
    pointer-events:none;opacity:.6;
  }

  /* ---------- Grid ---------- */
  .tools{display:grid;gap:1rem;grid-template-columns:1fr}
  @media(min-width:640px){.tools{grid-template-columns:1fr 1fr}}

  /* ---------- Tool card wrapper ---------- */
  .tool-wrap{position:relative}

  a.tool{
    display:flex;align-items:flex-start;gap:1rem;
    padding:1.5rem;border-radius:1.15rem;
    background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(30,41,59,.5));
    border:1px solid rgba(51,65,85,.85);
    text-decoration:none;color:inherit;
    transition:all .22s cubic-bezier(.2,.9,.3,1.2);
    position:relative;overflow:hidden;
    min-height:118px;
  }
  a.tool::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(245,196,81,.08),transparent 50%);
    opacity:0;transition:opacity .3s;
    pointer-events:none;
  }
  a.tool:hover{
    transform:translateY(-4px);
    border-color:rgba(245,196,81,.6);
    box-shadow:0 24px 44px -22px rgba(245,196,81,.55);
  }
  a.tool:hover::before{opacity:1}

  .icon{
    width:52px;height:52px;border-radius:.9rem;flex-shrink:0;
    display:grid;place-items:center;font-size:1.5rem;
    background:linear-gradient(145deg,rgba(245,196,81,.22),rgba(245,196,81,.04));
    border:1px solid rgba(245,196,81,.3);
    transition:transform .3s;
  }
  a.tool:hover .icon{transform:scale(1.08) rotate(-4deg)}

  .info{flex:1;min-width:0}
  .info h3{
    font-size:1rem;font-weight:800;margin-bottom:.35rem;
    color:#f1f5f9;
  }
  .info p{
    font-size:.78rem;color:#94a3b8;line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---------- Guide badge ---------- */
  a.guide-badge{
    position:absolute;top:.85rem;left:.85rem;
    display:inline-flex;align-items:center;gap:.35rem;
    padding:.35rem .7rem;
    font-size:.7rem;font-weight:800;
    color:#fde68a;
    background:linear-gradient(145deg,rgba(245,196,81,.22),rgba(245,196,81,.08));
    border:1px solid rgba(245,196,81,.55);
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 6px 16px -10px rgba(245,196,81,.7);
    transition:all .2s cubic-bezier(.2,.9,.3,1.2);
    z-index:2;
    font-family:inherit;
  }
  a.guide-badge:hover{
    background:linear-gradient(145deg,#f5c451,#dda62b);
    color:#1a1206;
    transform:translateY(-2px) scale(1.05);
    box-shadow:0 10px 22px -10px rgba(245,196,81,.95);
  }
  a.guide-badge:active{transform:scale(.96)}
  a.guide-badge .g-icon{font-size:.85rem;line-height:1}

  /* ---------- States ---------- */
  .state{text-align:center;padding:4rem 1rem;color:#64748b}
  .state .spinner{
    width:40px;height:40px;margin:0 auto 1rem;
    border-radius:50%;
    border:3px solid rgba(148,163,184,.2);
    border-top-color:#f5c451;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .state.error{color:#fca5a5}
  .state.error button{
    margin-top:1rem;padding:.5rem 1rem;
    background:rgba(148,163,184,.1);border:1px solid #334155;
    color:#cbd5e1;border-radius:.6rem;cursor:pointer;
    font-family:inherit;font-size:.85rem;font-weight:700;
    transition:all .15s;
  }
  .state.error button:hover{background:rgba(148,163,184,.2)}

  /* ---------- Skeleton ---------- */
  .skeleton{
    padding:1.5rem;border-radius:1.15rem;
    background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(30,41,59,.5));
    border:1px solid rgba(51,65,85,.85);
    display:flex;align-items:center;gap:1rem;
  }
  .skeleton .sq{
    width:52px;height:52px;border-radius:.9rem;flex-shrink:0;
    background:linear-gradient(90deg,#1e293b 25%,#26344a 50%,#1e293b 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  .skeleton .lines{flex:1;display:flex;flex-direction:column;gap:.5rem}
  .skeleton .line{
    height:12px;border-radius:6px;
    background:linear-gradient(90deg,#1e293b 25%,#26344a 50%,#1e293b 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  .skeleton .line.short{width:40%}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ---------- Footer ---------- */
  footer{
    text-align:center;margin-top:3rem;color:#475569;font-size:.75rem;
  }
  footer a{color:#60a5fa;text-decoration:none;transition:color .15s}
  footer a:hover{color:#93c5fd}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">🧰</div>
    <h1>أدواتي</h1>
    <p class="sub">مجموعة أدوات شخصية بسيطة ومفيدة</p>
  </header>

  <div class="search">
    <input id="searchInput" type="search" placeholder="ابحث عن أداة..." autocomplete="off" />
  </div>

  <div id="toolsContainer">
    <div class="tools">
      <div class="skeleton"><div class="sq"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
      <div class="skeleton"><div class="sq"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
      <div class="skeleton"><div class="sq"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
      <div class="skeleton"><div class="sq"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div>
    </div>
  </div>

  <footer>
    Made with ❤️ · <a href="https://github.com/AnasBuMalik/simple-tools" target="_blank" rel="noopener">GitHub Repository</a>
  </footer>
</div>

<script>
/* ============================================================
   فهرس الأدوات الديناميكي — مع دعم دليل الاستخدام
   ============================================================ */
(() => {
  'use strict';

  /* -------- الإعدادات -------- */
  const REPO_OWNER = 'AnasBuMalik';
  const REPO_NAME  = 'simple-tools';
  const BRANCH     = 'main';

  /* مجلدات يجب تجاهلها */
  const IGNORE = new Set([
    '.github', '.git', 'node_modules', 'assets', 'images', 'img',
    'docs', 'public', 'src', 'dist', 'build', 'css', 'js'
  ]);

  /* وصف مخصص لأدوات معروفة */
  const KNOWN = {
    'QuranMemorisingTool': {
      title: 'تَحفِيظ',
      desc: 'متابعة حفظ القرآن الكريم مع مزامنة Google Sheets ومجموعة تفاعلية.',
      icon: '📖'
    }
  };

  /* أنماط أسماء ملفات دليل الاستخدام (بأي امتداد HTML) */
  const GUIDE_PATTERNS = [
    /^how[\s\-_]*to[\s\-_]*use\.html?$/i,
    /^guide\.html?$/i,
    /^help\.html?$/i,
    /^readme\.html?$/i,
    /^instructions\.html?$/i,
    /^manual\.html?$/i,
    /^دليل[\s\-_]*الاستخدام\.html?$/i,
    /^دليل\.html?$/i,
    /^مساعدة\.html?$/i
  ];

  const ICON_RULES = [
    { match: /quran|قرآن|مصحف/i,   icon: '📖' },
    { match: /tool|أداة/i,         icon: '🛠️' },
    { match: /calc|حاسب|حاسبة/i,   icon: '🧮' },
    { match: /note|ملاحظ/i,        icon: '📝' },
    { match: /todo|مهام/i,         icon: '✅' },
    { match: /timer|مؤقت|ساعة/i,   icon: '⏱️' },
    { match: /game|لعبة/i,         icon: '🎮' },
    { match: /weather|طقس/i,       icon: '🌤️' },
    { match: /image|صور|صورة/i,    icon: '🖼️' },
    { match: /file|ملف/i,          icon: '📁' }
  ];

  /* -------- DOM -------- */
  const container   = document.getElementById('toolsContainer');
  const searchInput = document.getElementById('searchInput');
  let allTools = [];

  /* -------- Helpers -------- */
  const escapeHtml = s => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function prettify(name){
    return name
      .replace(/[-_]+/g, ' ')
      .replace(/([a-z])([A-Z])/g, '$1 $2')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function pickIcon(name){
    for (const r of ICON_RULES){
      if (r.match.test(name)) return r.icon;
    }
    return '🧩';
  }

  function isGuideFile(filename){
    return GUIDE_PATTERNS.some(re => re.test(filename));
  }

  /* -------- GitHub API -------- */
  const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

  async function ghFetch(path = ''){
    const url = `${API_BASE}/${path}?ref=${BRANCH}`;
    const res = await fetch(url, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok){
      if (res.status === 404) throw new Error('NOT_FOUND');
      if (res.status === 403) throw new Error('RATE_LIMIT');
      throw new Error('HTTP_' + res.status);
    }
    return await res.json();
  }

  /* فحص كل مجلد على حدة لاكتشاف ملف الدليل */
  async function detectGuides(folders){
    const results = await Promise.all(folders.map(async folder => {
      try {
        const items = await ghFetch(folder.name);
        if (!Array.isArray(items)) return { name: folder.name, guide: null };
        const guide = items.find(it =>
          it.type === 'file' && isGuideFile(it.name)
        );
        return { name: folder.name, guide: guide ? guide.name : null };
      } catch(e){
        // فشل الفحص لمجلد واحد لا يجب أن يُسقط الصفحة كلها
        return { name: folder.name, guide: null };
      }
    }));
    const map = {};
    results.forEach(r => { map[r.name] = r.guide; });
    return map;
  }

  /* -------- Build tool object -------- */
  function buildTool(folder, guideFile){
    const known = KNOWN[folder.name] || {};
    return {
      name: folder.name,
      title: known.title || prettify(folder.name),
      desc: known.desc || 'انقر للدخول إلى الأداة',
      icon: known.icon || pickIcon(folder.name),
      url: `./${encodeURIComponent(folder.name)}/`,
      guide: guideFile
        ? `./${encodeURIComponent(folder.name)}/${encodeURIComponent(guideFile)}`
        : null,
      guideName: guideFile
    };
  }

  /* -------- Rendering -------- */
  function renderLoading(){
    container.innerHTML = `
      <div class="tools">
        ${Array(4).fill(0).map(() => `
          <div class="skeleton">
            <div class="sq"></div>
            <div class="lines">
              <div class="line"></div>
              <div class="line short"></div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  function renderError(msg){
    container.innerHTML = `
      <div class="state error">
        <p>⚠️ ${escapeHtml(msg)}</p>
        <button id="retryBtn">إعادة المحاولة</button>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', load);
  }

  function renderTools(tools){
    if (!tools.length){
      container.innerHTML = `
        <div class="state">
          <p>لا توجد أدوات مطابقة.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="tools">
        ${tools.map(t => `
          <div class="tool-wrap">
            <a class="tool" href="${t.url}" title="${escapeHtml(t.name)}">
              <div class="icon">${t.icon}</div>
              <div class="info">
                <h3>${escapeHtml(t.title)}</h3>
                <p>${escapeHtml(t.desc)}</p>
              </div>
            </a>
            ${t.guide ? `
              <a class="guide-badge" href="${t.guide}"
                 title="دليل الاستخدام: ${escapeHtml(t.guideName)}"
                 aria-label="فتح دليل الاستخدام">
                <span class="g-icon">📘</span>
                <span>دليل</span>
              </a>
            ` : ''}
          </div>
        `).join('')}
      </div>`;
  }

  /* -------- Load -------- */
  async function load(){
    renderLoading();

    try {
      const items = await ghFetch('');
      if (!Array.isArray(items)) throw new Error('BAD_RESPONSE');

      const folders = items
        .filter(it => it.type === 'dir')
        .filter(it => !it.name.startsWith('.'))
        .filter(it => !IGNORE.has(it.name));

      if (!folders.length){
        allTools = [];
        renderTools(allTools);
        return;
      }

      // فحص كل مجلد لاكتشاف ملف الدليل
      const guideMap = await detectGuides(folders);

      const tools = folders
        .map(f => buildTool(f, guideMap[f.name]))
        .sort((a, b) => a.title.localeCompare(b.title, 'ar'));

      allTools = tools;
      renderTools(tools);
      applyFilter();

    } catch(err){
      console.error('GitHub API error:', err);
      let msg = 'تعذّر جلب قائمة الأدوات';
      if (err.message === 'NOT_FOUND') msg = 'المستودع أو الفرع غير موجود';
      else if (err.message === 'RATE_LIMIT') msg = 'تجاوزت حد GitHub API — حاول بعد دقيقة';
      else if (err.message && err.message.startsWith('HTTP_')) msg = `فشل الاتصال (${err.message})`;
      renderError(msg);
    }
  }

  /* -------- Search -------- */
  function applyFilter(){
    const q = searchInput.value.trim().toLowerCase();
    if (!q){ renderTools(allTools); return; }
    const filtered = allTools.filter(t =>
      t.title.toLowerCase().includes(q) ||
      t.name.toLowerCase().includes(q)
    );
    renderTools(filtered);
  }

  searchInput.addEventListener('input', applyFilter);

  /* -------- Start -------- */
  load();
})();
</script>

</body>
</html>
