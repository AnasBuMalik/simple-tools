<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدواتي · Simple Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(1000px 500px at 100% -10%, rgba(56,189,248,.10), transparent 60%),
               radial-gradient(800px 500px at 0% 110%, rgba(245,196,81,.07), transparent 60%),
               #0f172a;
    color:#e2e8f0;
    font-family:'Tajawal',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:2rem 1rem;
  }
  .wrap{max-width:720px;width:100%}
  h1{
    font-size:2rem;font-weight:800;text-align:center;margin-bottom:.5rem;
    letter-spacing:-.02em;
  }
  .sub{text-align:center;color:#94a3b8;font-size:.9rem;margin-bottom:3rem}
  .tools{display:grid;gap:1rem;grid-template-columns:1fr}
  @media(min-width:600px){.tools{grid-template-columns:1fr 1fr}}
  a.tool{
    display:flex;align-items:center;gap:1rem;
    padding:1.5rem;border-radius:1.15rem;
    background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(30,41,59,.55));
    border:1px solid rgba(51,65,85,.85);
    text-decoration:none;color:inherit;
    transition:all .22s cubic-bezier(.2,.9,.3,1.2);
  }
  a.tool:hover{
    transform:translateY(-4px);
    border-color:#f5c451;
    box-shadow:0 20px 40px -20px rgba(245,196,81,.5);
  }
  .icon{
    width:56px;height:56px;border-radius:1rem;flex-shrink:0;
    display:grid;place-items:center;font-size:1.6rem;
    background:linear-gradient(145deg,rgba(245,196,81,.25),rgba(245,196,81,.05));
    border:1px solid rgba(245,196,81,.35);
  }
  .info h3{font-size:1.05rem;font-weight:800;margin-bottom:.25rem}
  .info p{font-size:.8rem;color:#94a3b8;line-height:1.6}
  footer{
    text-align:center;margin-top:3rem;color:#475569;font-size:.78rem;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>أدواتي</h1>
  <p class="sub">مجموعة أدوات شخصية بسيطة ومفيدة</p>

  <div class="tools">

    <a href="./QuranMemorisingTool/" class="tool">
      <div class="icon">📖</div>
      <div class="info">
        <h3>تَحفِيظ</h3>
        <p>متابعة حفظ القرآن الكريم مع مزامنة Google Sheets</p>
      </div>
    </a>

    <!-- أضف أدواتك الأخرى هنا بنفس النمط -->
    <!--
    <a href="./Tool2/" class="tool">
      <div class="icon">🛠️</div>
      <div class="info">
        <h3>اسم الأداة</h3>
        <p>وصف مختصر</p>
      </div>
    </a>
    -->

  </div>

  <footer>
    Made with ❤️ · <a href="https://github.com/AnasBuMalik/simple-tools" style="color:#60a5fa;text-decoration:none">GitHub</a>
  </footer>
</div>

</body>
</html>
